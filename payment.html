<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koltuk Seçimi</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/payment.css" data-sayfa-css>
    <script src="js/data.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body>

    <header class="site-header">
        <a href="movies.html">
            <img class="logo" src="icons/scuu_cinema.webp" width="240" height="80" alt="logo">
        </a>   
    </header>
        
    <nav class="menu">
        <a href="movies.html"><span>Seans Seçimi</span></a>
        <a href="seats.html"><span>Koltuk Seçimi</span></a>
        <a href="payment.html"><span>Ödeme</span></a>
    </nav>


    <main class="select-seat">
        <section class="model-overlay" id="sms-model">
            <section class="model-kutu">
                <h3>SMS Doğrulama</h3>
                <p>Telefon numaranıza gönderilen 6 haneli kodu giriniz.</p>
                <input type="text" id="sms-kod" placeholder="* * * * * *" maxlength="6">
                <div class="model-butonlar">
                    <button id="sms-onayla">Onayla</button>
                    <button id="sms-iptal">İptal</button>
                </div>
                <p class="sms-hata" id="sms-hata"></p>
            </section>
        </section>

        <section class="card-info">
            <section class="inputs">
                <h3>Kart Sahibinin Adı</h3>
                <input type="text" id="cardholder-name" placeholder="Kart Sahibinin Adı" inputmode="text" autocomplete="cc-name" required>
            </section>
            <section class="inputs">
                <h3>Kart Numarası</h3>
                <input type="text" id="card-number" placeholder="Kart Numarası" inputmode="numeric" autocomplete="cc-number" required>
            </section>
            <section class="inputs">
                <h3>Son Kullanma Tarihi</h3>
                <input type="text" id="expiry-date" placeholder="Son Kullanma Tarihi (AA/YY)" inputmode="numeric" autocomplete="cc-exp" required>
            </section>
            <section class="inputs">
                <h3>CVV</h3>
                <input type="text" id="cvv" placeholder="CVV" inputmode="numeric" autocomplete="cc-csc" required>
            </section>
            <section class="inputs">
                <h3>Telefon </h3>
                <input type="tel" id="phone" placeholder="Telefon Numarası" inputmode="tel" autocomplete="tel" required>
            </section>
        </section>

        <section class="payment-summary"></section>
        
        <button id="pay-button">Ödeme Yap</button>

    </main>

    <footer class="site-footer">
        <section class="follow-us">
            <span>Bizi Takip Edin</span>
        </section>

        <section class="social-media-icons">
            <a href="https://www.instagram.com/cumunivkurumsal/" loading="lazy" target="_blank" ><img loading="lazy" src="icons/tiktok.webp" width="30" height="30" alt="tiktok"></a>
            <a href="https://www.instagram.com/cumunivkurumsal/" loading="lazy" target="_blank"><img loading="lazy" src="icons/instagram.webp" width="30" height="30" alt="Instagram"></a>
            <a href="https://x.com/cumunivkurumsal" loading="lazy" target="_blank"><img loading="lazy" src="icons/x.webp" width="30" height="30" alt="x"></a>
            <a href="https://wa.me/901234567890" loading="lazy" target="_blank"><img loading="lazy" src="icons/whatsapp.webp" width="30" height="30" alt="WhatsApp"></a>            
            <a href="https://www.youtube.com/@cumunivkurumsal" loading="lazy" target="_blank"><img loading="lazy" src="icons/yt.webp" width="45" height="30" alt="yt"></a>
        </section>
    </footer>

</body>

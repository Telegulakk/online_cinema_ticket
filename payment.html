    <main class="select-seat">
        <section class="card-info">
            <section class="inputs">
                <h3>Kart Sahibinin Adı</h3>
                <input type="text" id="cardholder-name" placeholder="Kart Sahibinin Adı" required>
            </section>
            <section class="inputs">
                <h3>Kart Numarası</h3>
                <input type="text" id="card-number" placeholder="Kart Numarası" required>
            </section>
            <section class="inputs">
                <h3>Son Kullanma Tarihi</h3>
                <input type="text" id="expiry-date" placeholder="Son Kullanma Tarihi (AA/YY)" required>
            </section>
            <section class="inputs">
                <h3>CVV</h3>
                <input type="text" id="cvv" placeholder="CVV" required>
            </section>
            <section class="inputs">
                <h3>Telefon </h3>
                <input type="text" id="phone" placeholder="Telefon Numarası" required>
            </section>
        </section>

        <section class="payment-summary"></section>
        
        <button id="pay-button">Ödeme Yap</button>

    </main>

    <footer class="site-footer">

        </section>
    </footer>
